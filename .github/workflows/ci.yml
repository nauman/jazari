# Two gates cover local maintainers and public contributors.
#
#   1. .githooks/pre-push — the LOCAL gate. Runs before a push, so a red suite
#      never leaves the machine: fast feedback, no waiting on a runner, nothing
#      broken in the open.
#
#   2. This workflow — the PUBLIC gate. Runs on every push and PR because
#      contributors do not have our git hooks, and a visible green badge is part
#      of how an open-source gem earns trust.
#
# The local hook is not made redundant by this; it is what keeps the public one
# green.
name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.4"]
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jazari_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      JAZARI_TEST_DATABASE: jazari_test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Boundary check and suite
        run: bundle exec rake
